<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Param Page</title>

    <style>
        /* Scale the page content up while keeping the image at 20% width. */
        body {
            margin: 0;
            padding: 20px;
            font-size: 2em;
        }

        img {
            width: 20%;
            margin: 20px auto;
            display: block;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        .param-row {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .param-row .name {
            width: 280px;
            flex-shrink: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .param-row input {
            flex: 1 1 auto;
            min-width: 0;
            padding: 10px;
            font-size: 1em;
        }

        .param-row .value {
            width: 100px;
            flex-shrink: 0;
            text-align: right;
        }

        .param-row button {
            width: 96px;
            height: 96px;
            flex-shrink: 0;
            font-size: 1em;
        }

        h1 {
            text-align: center;
            margin-top: 20px;
        }

        p {
            text-align: center;
        }
    </style>
</head>

<body>
    <img src="parampage.jpg" alt="Param page">

    <script>
        // Browsers cannot open raw UDP sockets. Instead, send JSON to a local
        // HTTP relay (see osc_relay.py), which forwards it as an OSC/UDP packet.
        function sendOsc(relayUrl, ip, port, address, args) {
            return fetch(relayUrl, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ ip, port, address, args })
            }).catch((error) => console.error("OSC send failed:", error));
        }

        const query = new URLSearchParams(window.location.search);

        // Each comma-separated parameter uses one of these formats:
        //   range:min:max:step:/address name
        //   button:/address argument1 argument2
        const params = (
            query.get("params") ||
            "range:0:100:1:/param a1,button:/voice pressed sine,button:/note pressed 60,button:/note released 60"
        ).split(",");

        // `sendto` is the OSC/UDP destination. `relay` is the local HTTP bridge.
        const sendTo = query.get("sendto") || "192.168.1.174:57120";
        const [oscIp, oscPort] = sendTo
            .replace(/^https?:\/\//, "")
            .split(":");
        const relay = query.get("relay") || "/osc";
        const body = document.body;

        // Show a short configuration preview while the controls are being built.
        body.innerHTML = `
            <img src="parampage.jpg" alt="Param page">
            <h1>Parameters</h1>
            <ul>${params.map((param) => `<li>${param}</li>`).join("")}</ul>
            <h1>Send To</h1>
            <p>${sendTo}</p>
        `;

        // Keep the delay so the configuration preview remains visible briefly.
        setTimeout(() => {
            body.innerHTML = '<img src="parampage.jpg" alt="Param page">';

            const form = document.createElement("form");
            body.appendChild(form);

            params.forEach((param) => {
                const parts = param.split(":");
                const type = parts[0];
                const row = document.createElement("div");
                row.className = "param-row";
                form.appendChild(row);

                const input = document.createElement("input");
                input.type = type;
                input.name = param;

                // Range parameters contain separate min, max, step, and address
                // fields. Button parameters store the complete OSC command after
                // the type, so their remaining fields are treated as one value.
                let addressName;
                if (type === "range") {
                    const [, min, max, step, address] = parts;
                    addressName = address;
                    input.min = min;
                    input.max = max;
                    input.step = step;
                    input.value = min;
                } else {
                    addressName = parts.slice(1).join(":");
                    input.value = addressName;
                }

                // The label displays the OSC address (and, for ranges, the name).
                const nameLabel = document.createElement("label");
                nameLabel.className = "name";
                nameLabel.textContent = addressName || "Unnamed parameter";
                row.appendChild(nameLabel);

                if (type === "range") {
                    const valueLabel = document.createElement("label");
                    valueLabel.className = "value";
                    valueLabel.textContent = input.value;

                    // Send the updated numeric value whenever the slider moves.
                    input.addEventListener("input", () => {
                        valueLabel.textContent = input.value;
                        const value = parseFloat(input.value);
                        const [address, name] = addressName.split(" ");

                        console.log(
                            `Sending OSC to ${address} with args: [${name}, ${value}]`
                        );
                        sendOsc(
                            relay,
                            oscIp,
                            parseInt(oscPort, 10),
                            address,
                            ["pressed", name, value]
                        );
                    });

                    row.appendChild(input);
                    row.appendChild(valueLabel);
                } else {
                    // Button values are formatted as: /address argument1 argument2.
                    // Split off the OSC address before sending the remaining arguments.
                    input.addEventListener("click", () => {
                        const fields = input.value.split(" ");
                        const address = fields.shift();

                        console.log(`Sending OSC to ${address} with args:`, fields);
                        sendOsc(
                            relay,
                            oscIp,
                            parseInt(oscPort, 10),
                            address,
                            fields
                        );
                    });

                    row.appendChild(input);
                }
            });
        }, 2000);
    </script>
</body>

</html>
