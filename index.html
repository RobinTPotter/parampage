<html>

<head>
    <title>My Param Page</title>
    <style>
        img { width:100%; }
        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .param-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .param-row .name {
            width: 140px;
            flex-shrink: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .param-row input {
            flex: 1 1 auto;
            min-width: 0;
        }
        .param-row .value {
            width: 50px;
            flex-shrink: 0;
            text-align: right;
        }
        .param-row button {
            width: 48px;
            height: 48px;
            flex-shrink: 0;
            font-size: 1.2em;
        }
    </style>
</head>

<body>
<img src="parampage.jpg">
<script>
    // Browsers can't open raw UDP sockets, so we POST JSON to a local
    // HTTP relay (see osc_relay.py) which forwards it as a real OSC/UDP packet.
    function sendOsc(relayUrl, ip, port, address, args) {
        return fetch(relayUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ ip, port, address, args })
        }).catch(err => console.error("OSC send failed:", err));
    }

    let params = (new URLSearchParams(window.location.search).get("params") || "range.0.100.1./param a1").split(",");
    // sendto identifies the real OSC/UDP target; relay is the local HTTP bridge
    let sendto = (new URLSearchParams(window.location.search).get("sendto") || "192.168.1.174:57120");
    let [oscIp, oscPort] = sendto.replace(/^https?:\/\//, "").split(":");
    let relay = (new URLSearchParams(window.location.search).get("relay") || "/osc");
    let body = document.body;
    body.innerHTML = '<img src="parampage.jpg"><h1>Parameters</h1><ul>' + params.map(p => "<li>" + p + "</li>").join("") + "</ul>";
    body.innerHTML += "<h1>Send To</h1><p>" + sendto + "</p>";
    setTimeout(() => {
        body.innerHTML ='<img src="parampage.jpg">';
        let form = document.createElement("form");
        body.appendChild(form);
        params.forEach(p => {
            // split params into parts by . type.min.max.division.address
            // if type is slider, use min, max, and division for input attributes
            // and create a slider input element
            // labeleld for the address
            let parts = p.split(":");
            let type = parts[0];
            let min = parts[1];
            let max = parts[2];
            let division = parts[3];
            let address_name = parts[4]; 
            
            let row = document.createElement("div");
            row.className = "param-row";
            form.appendChild(row);

            let label = document.createElement("label");
            label.className = "name";
            label.innerHTML = address_name;
            row.appendChild(label);

            let input = document.createElement("input");
            input.type = type;
            if (type == "range") {
                input.min = min;
                input.max = max;
                input.step = division;
            }
            input.name = p;
            input.value = min;
            row.appendChild(input);
            // add another label for the value which needs to update
            let valueLabel = document.createElement("label");
            valueLabel.className = "value";
            valueLabel.innerHTML = input.value;
            row.appendChild(valueLabel);
            input.addEventListener("input", () => {
                valueLabel.innerHTML = input.value;
            });
            // send the current value to the osc server at the parameter's address
            let button = document.createElement("button");
            button.type = "button";
            button.innerHTML = ">";
            button.addEventListener("click", () => {
                let value = type == "range" ? parseFloat(input.value) : input.value;
                let [address, name] = address_name.split(" ");
                console.log(`Sending OSC to ${address} with args: [${name}, ${value}]`);
                sendOsc(relay, oscIp, parseInt(oscPort), address, ["pressed", name,value]);
            });
            row.appendChild(button);
        });
    }, 2000);
</script>


</body>

</html>
