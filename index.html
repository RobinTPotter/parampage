<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Param Page</title>

    <style>
        img {
            width: 20%;
            display: block;
            margin: 0 auto;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .param-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .param-row .name {
            width: 140px;
            flex-shrink: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .param-row input {
            flex: 1 1 auto;
            min-width: 0;
        }

        .param-row .value {
            width: 50px;
            flex-shrink: 0;
            text-align: right;
        }

        .param-row button {
            width: 48px;
            height: 48px;
            flex-shrink: 0;
            font-size: 1.2em;
        }

        dialog {
            width: min(90vw, 600px);
            border: 0;
            border-radius: 8px;
            padding: 24px;
            box-shadow: 0 4px 24px #0005;
        }

        dialog::backdrop {
            background: #0008;
        }

        .link-builder,
        .link-builder-params {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-builder-actions,
        .add-param-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .new-param {
            display: flex;
            gap: 8px;
        }

        .new-param input,
        #generated-link {
            flex: 1;
            min-width: 0;
        }

        #generated-link {
            width: 100%;
        }

        .dialog-close {
            margin-left: auto;
        }
    </style>
</head>

<body>
    <img src="parampage.jpg" alt="Param page">

    <script>
        // Browsers cannot open raw UDP sockets. Instead, send JSON to a local
        // HTTP relay (see osc_relay.py), which forwards it as an OSC/UDP packet.
        function sendOsc(relayUrl, ip, port, address, args) {
            return fetch(relayUrl, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ ip, port, address, args })
            }).catch((error) => console.error("OSC send failed:", error));
        }

        const query = new URLSearchParams(window.location.search);

        // Each comma-separated parameter uses one of these formats:
        //   range:min:max:step:/address name
        //   button:/address argument1 argument2
        const params = (
            query.get("params") ||
            "range:0:100:1:/param a1,button:/voice pressed sine,button:/note pressed 60,button:/note released 60"
        ).split(",");

        // `sendto` is the OSC/UDP destination. `relay` is the local HTTP bridge.
        const sendTo = query.get("sendto") || "192.168.1.174:57120";
        const [oscIp, oscPort] = sendTo
            .replace(/^https?:\/\//, "")
            .split(":");
        const relay = query.get("relay") || "/osc";
        const body = document.body;

        // Show a short configuration preview while the controls are being built.
        body.innerHTML = `
            <img src="parampage.jpg" alt="Param page">
            <h1>Parameters</h1>
            <ul>${params.map((param) => `<li>${param}</li>`).join("")}</ul>
            <h1>Send To</h1>
            <p>${sendTo}</p>
        `;

        function openLinkBuilder() {
            const dialog = document.createElement("dialog");
            dialog.setAttribute("aria-labelledby", "link-builder-title");

            const builder = document.createElement("div");
            builder.className = "link-builder";

            const title = document.createElement("h2");
            title.id = "link-builder-title";
            title.textContent = "Create a new link";
            builder.appendChild(title);

            const instructions = document.createElement("p");
            instructions.textContent = "Add parameters to include in the link. You can edit each parameter before creating the link.";
            builder.appendChild(instructions);

            const addActions = document.createElement("div");
            addActions.className = "add-param-actions";

            const paramList = document.createElement("div");
            paramList.className = "link-builder-params";
            paramList.setAttribute("aria-label", "Parameters in new link");

            const linkInput = document.createElement("input");
            linkInput.id = "generated-link";
            linkInput.type = "url";
            linkInput.readOnly = true;
            linkInput.setAttribute("aria-label", "Generated link");

            function updateLink() {
                const nextUrl = new URL(window.location.href);
                const values = Array.from(paramList.querySelectorAll("input"))
                    .map((input) => input.value.trim())
                    .filter(Boolean);
                if (values.length) {
                    nextUrl.searchParams.set("params", values.join(","));
                } else {
                    nextUrl.searchParams.delete("params");
                }
                linkInput.value = nextUrl.toString();
            }

            function addParam(type) {
                const row = document.createElement("div");
                row.className = "new-param";

                const input = document.createElement("input");
                input.type = "text";
                input.setAttribute("aria-label", `${type} parameter`);
                input.value = type === "range"
                    ? "range:0:1:0.05:/param"
                    : "button:/button";
                input.addEventListener("input", updateLink);
                row.appendChild(input);

                const removeButton = document.createElement("button");
                removeButton.type = "button";
                removeButton.textContent = "Remove";
                removeButton.addEventListener("click", () => {
                    row.remove();
                    updateLink();
                });
                row.appendChild(removeButton);
                paramList.appendChild(row);
                updateLink();
                input.focus();
            }

            const addButtonParam = document.createElement("button");
            addButtonParam.type = "button";
            addButtonParam.textContent = "button";
            addButtonParam.addEventListener("click", () => addParam("button"));
            addActions.appendChild(addButtonParam);

            const addRangeParam = document.createElement("button");
            addRangeParam.type = "button";
            addRangeParam.textContent = "range";
            addRangeParam.addEventListener("click", () => addParam("range"));
            addActions.appendChild(addRangeParam);
            builder.appendChild(addActions);
            builder.appendChild(paramList);

            const linkLabel = document.createElement("label");
            linkLabel.htmlFor = "generated-link";
            linkLabel.textContent = "New link";
            builder.appendChild(linkLabel);
            builder.appendChild(linkInput);

            const actions = document.createElement("div");
            actions.className = "link-builder-actions";

            const copyButton = document.createElement("button");
            copyButton.type = "button";
            copyButton.textContent = "Copy link";
            copyButton.addEventListener("click", async () => {
                try {
                    await navigator.clipboard.writeText(linkInput.value);
                    copyButton.textContent = "Copied!";
                } catch (error) {
                    linkInput.select();
                    console.error("Could not copy link:", error);
                }
            });
            actions.appendChild(copyButton);

            const closeButton = document.createElement("button");
            closeButton.type = "button";
            closeButton.className = "dialog-close";
            closeButton.textContent = "Close";
            closeButton.addEventListener("click", () => dialog.close());
            actions.appendChild(closeButton);
            builder.appendChild(actions);

            dialog.appendChild(builder);
            dialog.addEventListener("click", (event) => {
                if (event.target === dialog) dialog.close();
            });
            body.appendChild(dialog);
            updateLink();
            dialog.showModal();
        }

        // Keep the delay so the configuration preview remains visible briefly.
        setTimeout(() => {
            body.innerHTML = '<img src="parampage.jpg" alt="Param page">';

            const form = document.createElement("form");
            body.appendChild(form);

            params.forEach((param) => {
                const parts = param.split(":");
                const type = parts[0];
                const row = document.createElement("div");
                row.className = "param-row";
                form.appendChild(row);

                const input = document.createElement("input");
                input.type = type;
                input.name = param;

                // Range parameters contain separate min, max, step, and address
                // fields. Button parameters store the complete OSC command after
                // the type, so their remaining fields are treated as one value.
                let addressName;
                if (type === "range") {
                    const [, min, max, step, address] = parts;
                    addressName = address;
                    input.min = min;
                    input.max = max;
                    input.step = step;
                    input.value = min;
                } else {
                    addressName = parts.slice(1).join(":");
                    input.value = addressName;
                }

                // The label displays the OSC address (and, for ranges, the name).
                const nameLabel = document.createElement("label");
                nameLabel.className = "name";
                nameLabel.textContent = addressName || "Unnamed parameter";
                row.appendChild(nameLabel);

                if (type === "range") {
                    const valueLabel = document.createElement("label");
                    valueLabel.className = "value";
                    valueLabel.textContent = input.value;

                    // Send the updated numeric value whenever the slider moves.
                    input.addEventListener("input", () => {
                        valueLabel.textContent = input.value;
                        const value = parseFloat(input.value);
                        const [address, name] = addressName.split(" ");

                        console.log(
                            `Sending OSC to ${address} with args: [${name}, ${value}]`
                        );
                        sendOsc(
                            relay,
                            oscIp,
                            parseInt(oscPort, 10),
                            address,
                            ["pressed", name, value]
                        );
                    });

                    row.appendChild(input);
                    row.appendChild(valueLabel);
                } else {
                    // Button values are formatted as: /address argument1 argument2.
                    // Split off the OSC address before sending the remaining arguments.
                    input.addEventListener("click", () => {
                        const fields = input.value.split(" ");
                        const address = fields.shift();

                        console.log(`Sending OSC to ${address} with args:`, fields);
                        sendOsc(
                            relay,
                            oscIp,
                            parseInt(oscPort, 10),
                            address,
                            fields
                        );
                    });

                    row.appendChild(input);
                }
            });

            const createLinkButton = document.createElement("button");
            createLinkButton.type = "button";
            createLinkButton.textContent = "Create a new link";
            createLinkButton.addEventListener("click", openLinkBuilder);
            body.appendChild(createLinkButton);
        }, 2000);
    </script>
</body>

</html>
